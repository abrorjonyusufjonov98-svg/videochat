<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Videochat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.7/dist/livekit-client.umd.min.js"></script>
<style>
  :root {
    --bg: #17212b;
    --card: #232e3c;
    --card-hover: #2b3849;
    --fg: #ffffff;
    --muted: #7f91a4;
    --accent: #3ea6ff;
    --accent-glow: rgba(62, 166, 255, 0.35);
    --btn-dark: #22303f;
    --danger: #8e3b3b;
    --warn: #d9822b;
    --ok: #2ea043;
    --rec: #e53935;
    --border: rgba(255, 255, 255, 0.06);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  #join {
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin: auto;
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
  }

  #join h2 {
    margin: 0 0 4px 0;
    font-size: 21px;
    font-weight: 600;
    text-align: center;
  }

  input, select {
    padding: 13px 14px;
    font-size: 15px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: var(--bg);
    color: var(--fg);
    outline: none;
  }

  input:focus, select:focus {
    border-color: var(--accent);
  }

  input::placeholder {
    color: var(--muted);
  }

  .role-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .role-btn {
    padding: 10px;
    border-radius: 10px;
    background: var(--bg);
    color: var(--muted);
    border: 1px solid rgba(255, 255, 255, 0.08);
    font-size: 13px;
    font-weight: 600;
  }

  .role-btn.active {
    background: #2b5278;
    color: #fff;
    border-color: var(--accent);
  }

  button {
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.12s ease, opacity 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }

  button:active {
    transform: scale(0.95);
  }

  #joinBtn {
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 10px;
    background: #2b5278;
    color: #fff;
  }

  #joinBtn:hover {
    background: #336290;
  }

  #status {
    min-height: 18px;
    color: #ff8a8a;
    font-size: 13px;
    text-align: center;
    word-break: break-word;
  }

  #call {
    display: none;
    flex: 1;
    flex-direction: column;
    min-height: 0;
    height: 100%;
    background: var(--bg);
    position: relative;
  }

  #topbar {
    display: grid;
    grid-template-columns: 44px 1fr 44px;
    align-items: center;
    padding: 10px 12px 6px;
    background: var(--bg);
    flex-shrink: 0;
    position: relative;
    z-index: 30;
  }

  .icon-top-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-top-btn:hover {
    background: rgba(255, 255, 255, 0.06);
    color: var(--fg);
  }

  #centerHeader {
    text-align: center;
    min-width: 0;
  }

  #roomTitle {
    font-size: 16px;
    font-weight: 600;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #participantCount {
    font-size: 13px;
    color: var(--muted);
    margin-top: 1px;
  }

  #menuDropdown {
    display: none;
    position: absolute;
    top: 48px;
    left: 14px;
    min-width: 255px;
    background: var(--card);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    padding: 6px;
    z-index: 50;
  }

  #menuDropdown.open {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    background: transparent;
    color: var(--fg);
    font-size: 13.5px;
    text-align: left;
  }

  .menu-item:hover {
    background: var(--card-hover);
  }

  .menu-item.recording-item {
    color: #ff7b7b;
    font-weight: 600;
  }

  .menu-divider {
    height: 1px;
    background: var(--border);
    margin: 4px 6px;
  }

  #recBanner {
    display: none;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin: 2px 14px 6px;
    padding: 7px 12px;
    border-radius: 10px;
    background: rgba(229, 57, 53, 0.15);
    border: 1px solid rgba(229, 57, 53, 0.35);
    color: #ff9e9e;
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
  }

  #recBanner.active {
    display: flex;
  }

  #recBanner.info-banner {
    background: rgba(62, 166, 255, 0.14);
    border-color: rgba(62, 166, 255, 0.35);
    color: #b7dfff;
  }

  .rec-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--rec);
    animation: pulse 1s infinite;
  }

  .download-link-btn {
    padding: 3px 8px;
    border-radius: 6px;
    background: #2b5278;
    color: #fff;
    font-size: 11.5px;
    text-decoration: none;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  #teacherPanel {
    display: none;
    margin: 4px 14px 6px;
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid rgba(62, 166, 255, 0.25);
    flex-shrink: 0;
  }

  #teacherPanel.visible {
    display: block;
  }

  .teacher-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: 600;
  }

  .teacher-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .mini-btn {
    padding: 6px 10px;
    border-radius: 8px;
    background: var(--btn-dark);
    color: var(--fg);
    font-size: 12px;
    font-weight: 500;
  }

  .mini-btn:hover {
    background: var(--card-hover);
  }

  .mini-btn.primary {
    background: #2b5278;
  }

  #grid {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px 14px;
    overflow-y: auto;
  }

  .tile.has-video {
    position: relative;
    width: 100%;
    min-height: 220px;
    aspect-ratio: 16 / 10;
    background: #0e141b;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }

  .tile.has-video.speaking {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-glow);
  }

  .tile.has-video video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .tile.has-video .list-row {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 10px 12px;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.82));
  }

  .tile.has-video .avatar-circle {
    width: 32px;
    height: 32px;
    font-size: 13px;
  }

  .tile.video-off {
    background: var(--card);
    border-radius: 12px;
    padding: 10px 14px;
    border: 1px solid transparent;
    flex-shrink: 0;
  }

  .tile.video-off.speaking {
    border-color: rgba(62, 166, 255, 0.45);
  }

  .tile.video-off.hand-raised {
    border-color: rgba(255, 193, 7, 0.55);
  }

  .tile.video-off video {
    display: none;
  }

  .list-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .user-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .avatar-circle {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #5294e2;
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    user-select: none;
  }

  .user-meta {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .name-line {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }

  .tile-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .role-badge {
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 6px;
    background: rgba(62, 166, 255, 0.2);
    color: #8ccaff;
    font-weight: 600;
    flex-shrink: 0;
  }

  .hand-badge {
    font-size: 11.5px;
    padding: 2px 7px;
    border-radius: 6px;
    background: rgba(255, 193, 7, 0.2);
    color: #ffd54f;
    font-weight: 600;
    flex-shrink: 0;
  }

  .status-text {
    font-size: 13px;
    color: var(--accent);
    margin-top: 2px;
  }

  .right-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .tile-mod-btn {
    padding: 4px 8px;
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--fg);
    font-size: 11.5px;
  }

  .tile-mod-btn:hover {
    background: rgba(255, 255, 255, 0.15);
  }

  .tile-mod-btn.kick {
    background: rgba(142, 59, 59, 0.45);
    color: #ffb8b8;
  }

  .mic-icon-right {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    flex-shrink: 0;
  }

  .mic-icon-right.unmuted {
    color: var(--accent);
  }

  #controls {
    display: flex;
    justify-content: space-around;
    align-items: flex-start;
    gap: 6px;
    padding: 12px 12px calc(24px + env(safe-area-inset-bottom, 0px));
    background: var(--bg);
    flex-shrink: 0;
    position: relative;
    z-index: 20;
  }

  .ctrl-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    min-width: 56px;
  }

  .ctrl-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--btn-dark);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }

  .ctrl-btn svg {
    width: 24px;
    height: 24px;
    fill: currentColor;
  }

  #micBtn {
    background: radial-gradient(circle at 30% 30%, #45b6ff, #1c8adb);
    box-shadow: 0 0 18px var(--accent-glow);
  }

  #micBtn.active {
    background: radial-gradient(circle at 30% 30%, #38bdf8, #0284c7);
    box-shadow: 0 0 22px rgba(56, 189, 248, 0.55);
  }

  #camBtn.active,
  #screenBtn.active {
    background: #2d5c8a;
    box-shadow: 0 0 14px rgba(62, 166, 255, 0.35);
  }

  #handBtn.active {
    background: #9a6b00;
    box-shadow: 0 0 14px rgba(255, 193, 7, 0.4);
  }

  #leaveBtn {
    background: var(--danger);
  }

  .ctrl-label {
    font-size: 11.5px;
    color: #d0dae5;
    user-select: none;
  }
</style>
</head>
<body>
<div id="join">
  <h2>Videochat</h2>
  <input id="name" placeholder="Ism va familiyangiz">
  <input id="room" placeholder="Dars / xona nomi">
  <div class="role-row">
    <button type="button" class="role-btn active" data-role="student">🎓 O‘quvchi</button>
    <button type="button" class="role-btn" data-role="teacher">👑 Ustoz</button>
  </div>
  <button id="joinBtn">Kirish</button>
  <small id="status"></small>
</div>

<div id="call">
  <div id="topbar">
    <button id="menuBtn" class="icon-top-btn" type="button" title="Menyu">⋮</button>
    <div id="centerHeader">
      <div id="roomTitle">Xona</div>
      <div id="participantCount">1 participant</div>
    </div>
    <button id="expandBtn" class="icon-top-btn" type="button" title="Kattalashtirish">⤢</button>

    <div id="menuDropdown">
      <button id="menuRecBtn" class="menu-item" type="button">⏺️ Darsni yozishni boshlash</button>
      <button id="menuTeacherPanelBtn" class="menu-item" type="button">👑 Ustozlar paneli</button>
      <div class="menu-divider"></div>
      <button id="menuCopyBtn" class="menu-item" type="button">🔗 Telegram taklif silka</button>
      <button id="menuCopyWebBtn" class="menu-item" type="button">💻 Kompyuterdan kirish linki</button>
      <button id="menuShareGroupBtn" class="menu-item" type="button">📢 Guruh/kanalga yuborish matni</button>
      <button id="menuExpandBtn" class="menu-item" type="button">🖥️ Oynani kattalashtirish</button>
    </div>
  </div>

  <div id="recBanner">
    <span class="rec-dot" id="recDot"></span>
    <span id="recStatusText">Ovoz yozilmoqda: <b id="recTimer">00:00</b></span>
    <a id="recDownloadLink" class="download-link-btn" style="display:none;" download>⬇️ Yuklab olish</a>
  </div>

  <div id="teacherPanel">
    <div class="teacher-panel-head">
      <span>👑 Ustozlar va navbat boshqaruvi</span>
      <span id="queueSummary" style="color:var(--muted);font-size:12px;">Navbat: 0</span>
    </div>
    <div class="teacher-actions">
      <button id="claimTeacherBtn" class="mini-btn primary" type="button">👑 Meni ustoz qil</button>
      <button id="callNextBtn" class="mini-btn" type="button">✋ Navbatdagini chaqirish</button>
      <button id="clearHandsBtn" class="mini-btn" type="button">🧹 Qo‘llarni tushirish</button>
    </div>
  </div>

  <div id="grid"></div>

  <div id="controls">
    <div class="ctrl-item">
      <button id="handBtn" class="ctrl-btn" type="button" title="Qo‘l ko‘tarish">✋</button>
      <span class="ctrl-label" id="handLabel">Qo‘l</span>
    </div>

    <div class="ctrl-item">
      <button id="screenBtn" class="ctrl-btn" type="button" title="Screen">
        <svg viewBox="0 0 24 24"><path d="M20 18c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6zm9 4.5V8l4 3.5-4 3.5v-2.5c-2.5 0-4.2.8-5.5 2.5.5-2.5 2-5 5.5-4.5z"/></svg>
      </button>
      <span class="ctrl-label">Screen</span>
    </div>

    <div class="ctrl-item">
      <button id="camBtn" class="ctrl-btn" type="button" title="Video">
        <svg id="camIcon" viewBox="0 0 24 24"><path d="M21 6.5l-4 4V7c0-.55-.45-1-1-1H9.82L21 17.18V6.5zM3.27 2L2 3.27 4.73 6H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.21 0 .39-.08.54-.18L19.73 21 21 19.73 3.27 2z"/></svg>
      </button>
      <span class="ctrl-label">Video</span>
    </div>

    <div class="ctrl-item">
      <button id="micBtn" class="ctrl-btn" type="button" title="Unmute / Mute">
        <svg id="micIcon" viewBox="0 0 24 24"><path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/></svg>
      </button>
      <span class="ctrl-label" id="micLabel">Unmute</span>
    </div>

    <div class="ctrl-item">
      <button id="leaveBtn" class="ctrl-btn" type="button" title="Leave">
        <svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.956.956 0 0 1-.29-.7c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28a11.27 11.27 0 0 0-2.67-1.85.996.996 0 0 1-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
      </button>
      <span class="ctrl-label">Leave</span>
    </div>
  </div>
</div>

<script>
const BOT_USERNAME = "darsvideochati_bot";
const ADMIN_CHAT_ID = "9152309447";

const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready();
  tg.expand();
}

const $ = (id) => document.getElementById(id);
const encoder = new TextEncoder();
const decoder = new TextDecoder();

const user = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
if (user && user.first_name) {
  const full = [user.first_name, user.last_name].filter(Boolean).join(" ").trim();
  if (full && full !== ".") {
    $("name").value = full;
  }
}

let selectedInitialRole = "student";
document.querySelectorAll(".role-btn").forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll(".role-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    selectedInitialRole = btn.dataset.role || "student";
  };
});

function getInviteRoomFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const fromQuery = params.get("room") || params.get("tgWebAppStartParam");
  const fromTg = tg && tg.initDataUnsafe ? tg.initDataUnsafe.start_param : "";
  const raw = (fromTg || fromQuery || "").trim();
  if (!raw) return "";
  try {
    return decodeURIComponent(raw);
  } catch {
    return raw;
  }
}

const invitedRoom = getInviteRoomFromUrl();
if (invitedRoom) {
  $("room").value = invitedRoom;
}

let room;
let micEnabled = true;
let camEnabled = false;
let screenEnabled = false;
let currentRoomName = "";

const teachersMap = new Map();
let handQueue = [];
let myHandRaised = false;
let panelForceOpen = false;

let mediaRecorder = null;
let recordedChunks = [];
let recSeconds = 0;
let recInterval = null;
let audioCtx = null;
let audioDest = null;
const connectedAudioSources = new Map();
let lastAudioObjectUrl = null;

const SVG_MIC_ON = '<path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15a.998.998 0 0 0-.98-.85c-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>';
const SVG_MIC_OFF = '<path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/>';
const SVG_CAM_ON = '<path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>';

function getLocalId() {
  return room && room.localParticipant ? room.localParticipant.identity : "";
}

function isLocalTeacher() {
  const lid = getLocalId();
  return !!(lid && teachersMap.get(lid));
}

function getInitials(fullName) {
  const parts = String(fullName || "U").trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return "U";
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function updateParticipantCount() {
  if (!room) {
    $("participantCount").textContent = "1 participant";
    return;
  }
  const total = 1 + (room.remoteParticipants ? room.remoteParticipants.size : 0);
  $("participantCount").textContent = total + (total === 1 ? " participant" : " participants");
}

function broadcastState(extra = {}) {
  if (!room || !room.localParticipant) return;
  const payload = {
    type: "ROOM_SYNC",
    teachers: Array.from(teachersMap.entries()).filter(([, v]) => v).map(([k]) => k),
    queue: handQueue.slice(),
    ...extra
  };
  try {
    room.localParticipant.publishData(encoder.encode(JSON.stringify(payload)), { reliable: true });
  } catch (e) {
    console.warn("Data broadcast error:", e);
  }
}

function refreshTeacherPanel() {
  const canManage = isLocalTeacher();
  $("teacherPanel").classList.toggle("visible", canManage || panelForceOpen);
  $("queueSummary").textContent = "Navbat: " + handQueue.length;
  $("claimTeacherBtn").textContent = canManage ? "👑 Ustoz rejimidasiz" : "👑 Meni ustoz qil";
}

function refreshAllBadges() {
  const amTeacher = isLocalTeacher();
  const localId = getLocalId();

  document.querySelectorAll(".tile").forEach((tile) => {
    const pid = tile.id.replace(/^t-/, "");
    const isT = !!teachersMap.get(pid);
    const qIdx = handQueue.indexOf(pid);
    const raised = qIdx !== -1;

    tile.classList.toggle("hand-raised", raised && tile.classList.contains("video-off"));

    const badgeWrap = tile.querySelector(".badge-slot");
    if (badgeWrap) {
      let html = "";
      if (isT) html += '<span class="role-badge">Ustoz</span>';
      if (raised) html += '<span class="hand-badge">✋ #' + (qIdx + 1) + '</span>';
      badgeWrap.innerHTML = html;
    }

    const modWrap = tile.querySelector(".mod-slot");
    if (modWrap) {
      if (amTeacher && pid !== localId) {
        modWrap.innerHTML =
          '<button type="button" class="tile-mod-btn" data-act="toggle-teacher" data-pid="' + pid + '">' +
            (isT ? "Ustozlikni olish" : "Ustoz qilish") +
          '</button>' +
          '<button type="button" class="tile-mod-btn kick" data-act="kick" data-pid="' + pid + '">Uzish</button>';
      } else {
        modWrap.innerHTML = "";
      }
    }
  });

  document.querySelectorAll(".tile-mod-btn").forEach((btn) => {
    btn.onclick = () => {
      const targetId = btn.dataset.pid;
      const act = btn.dataset.act;
      if (!isLocalTeacher() || !targetId) return;

      if (act === "toggle-teacher") {
        const nextVal = !teachersMap.get(targetId);
        teachersMap.set(targetId, nextVal);
        refreshAllBadges();
        refreshTeacherPanel();
        broadcastState();
      } else if (act === "kick") {
        broadcastState({ kickIdentity: targetId });
        const t = document.getElementById("t-" + targetId);
        if (t) t.remove();
        handQueue = handQueue.filter((x) => x !== targetId);
        refreshAllBadges();
        refreshTeacherPanel();
      }
    };
  });
}

function addTile(id, displayName) {
  const safeName = displayName || id;
  let t = document.getElementById("t-" + id);
  if (!t) {
    t = document.createElement("div");
    t.className = "tile video-off";
    t.id = "t-" + id;

    const row = document.createElement("div");
    row.className = "list-row";
    row.innerHTML =
      '<div class="user-left">' +
        '<div class="avatar-circle">' + getInitials(safeName) + '</div>' +
        '<div class="user-meta">' +
          '<div class="name-line">' +
            '<div class="tile-name" title="' + safeName + '">' + safeName + '</div>' +
            '<span class="badge-slot"></span>' +
          '</div>' +
          '<div class="status-text">listening</div>' +
        '</div>' +
      '</div>' +
      '<div class="right-controls">' +
        '<span class="mod-slot"></span>' +
        '<div class="mic-icon-right" id="mic-state-' + id + '">' +
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">' + SVG_MIC_OFF + '</svg>' +
        '</div>' +
      '</div>';

    t.appendChild(row);
    $("grid").appendChild(t);
  } else {
    const tn = t.querySelector(".tile-name");
    const av = t.querySelector(".avatar-circle");
    if (tn) { tn.textContent = safeName; tn.title = safeName; }
    if (av) av.textContent = getInitials(safeName);
  }
  refreshAllBadges();
  return t;
}

function setTileVideoState(id, hasVideo) {
  const t = document.getElementById("t-" + id);
  if (!t) return;
  if (hasVideo) {
    t.classList.remove("video-off");
    t.classList.add("has-video");
  } else {
    t.classList.remove("has-video");
    t.classList.add("video-off");
  }
  refreshAllBadges();
}

function setTileMicState(id, isMuted) {
  const badge = document.getElementById("mic-state-" + id);
  if (!badge) return;
  badge.classList.toggle("unmuted", !isMuted);
  badge.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">' +
    (isMuted ? SVG_MIC_OFF : SVG_MIC_ON) + '</svg>';
}

function hookTrackIntoRecorder(track) {
  if (!audioDest || track.kind !== "audio" || !track.mediaStreamTrack) return;
  const key = track.sid || track.mediaStreamTrack.id;
  if (connectedAudioSources.has(key)) return;
  try {
    const stream = new MediaStream([track.mediaStreamTrack]);
    const source = audioCtx.createMediaStreamSource(stream);
    source.connect(audioDest);
    connectedAudioSources.set(key, source);
  } catch (e) {
    console.warn("Audio mix error:", e);
  }
}

function attach(track, participant) {
  const id = participant.identity;
  const displayName = participant.name || id;
  const t = addTile(id, displayName);

  if (track.kind === "video") {
    const oldVideo = t.querySelector("video");
    if (oldVideo) oldVideo.remove();
    const videoEl = track.attach();
    t.prepend(videoEl);
    setTileVideoState(id, true);
  } else if (track.kind === "audio") {
    if (!participant.isLocal) {
      const audioEl = track.attach();
      document.body.appendChild(audioEl);
    }
    hookTrackIntoRecorder(track);
  }
}

function detachTrack(track, participant) {
  const els = track.detach();
  els.forEach((el) => el.remove());
  if (track.kind === "video" && participant) {
    const t = document.getElementById("t-" + participant.identity);
    if (t && !t.querySelector("video")) {
      setTileVideoState(participant.identity, false);
    }
  }
}

function syncParticipant(participant, isLocal = false) {
  const id = participant.identity;
  const displayName = participant.name || id;
  addTile(id, displayName);

  let hasActiveVideo = false;
  participant.trackPublications.forEach((pub) => {
    if (pub.track && pub.kind === "video" && !pub.isMuted) {
      attach(pub.track, participant);
      hasActiveVideo = true;
    } else if (pub.track && pub.kind === "audio") {
      if (!isLocal) attach(pub.track, participant);
      else hookTrackIntoRecorder(pub.track);
    }
  });
  setTileVideoState(id, hasActiveVideo);

  const micPub = participant.getTrackPublication(LivekitClient.Track.Source.Microphone);
  setTileMicState(id, !micPub || micPub.isMuted);
}

function formatTime(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, "0");
  const s = String(sec % 60).padStart(2, "0");
  return m + ":" + s;
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => {
      const res = String(reader.result || "");
      const base64 = res.includes(",") ? res.split(",")[1] : res;
      resolve(base64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function triggerLocalDownload(blob, fileName) {
  if (lastAudioObjectUrl) {
    URL.revokeObjectURL(lastAudioObjectUrl);
  }
  const url = URL.createObjectURL(blob);
  lastAudioObjectUrl = url;

  const a = document.createElement("a");
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();

  const dlBtn = $("recDownloadLink");
  dlBtn.href = url;
  dlBtn.download = fileName;
  dlBtn.style.display = "inline-block";
}

async function deliverRecordedAudio(blob, fileName, durationStr) {
  triggerLocalDownload(blob, fileName);

  const targetChatId = ADMIN_CHAT_ID || ((user && user.id) ? user.id : null);
  $("recBanner").classList.remove("info-banner");
  $("recBanner").classList.add("active");
  $("recDot").style.display = "none";

  if (!targetChatId) {
    $("recStatusText").textContent = "✅ Ovoz yozildi (" + durationStr + ") va qurilmaga yuklandi!";
    return;
  }

  $("recStatusText").textContent = "Ovoz botga yuborilmoqda...";

  try {
    const audioBase64 = await blobToBase64(blob);
    const res = await fetch("/api/upload-audio", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        audioBase64,
        fileName,
        chatId: targetChatId,
        roomName: currentRoomName,
        duration: durationStr
      })
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      throw new Error(data.error || "Bot javob bermadi");
    }
    $("recStatusText").textContent = "✅ Ovoz botga yuborildi va fayl tayyor!";
  } catch (err) {
    $("recStatusText").textContent = "⚠️ Botga yuborilmadi (" + err.message + "), fayl yuklandi";
  }
}

async function startRecording() {
  if (!room) {
    showTempBanner("⚠️ Avval xonaga kiring");
    return;
  }

  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContextClass();
    audioDest = audioCtx.createMediaStreamDestination();
    connectedAudioSources.clear();

    const localMic = room.localParticipant.getTrackPublication(LivekitClient.Track.Source.Microphone);
    if (localMic && localMic.track) hookTrackIntoRecorder(localMic.track);

    room.remoteParticipants.forEach((p) => {
      p.trackPublications.forEach((pub) => {
        if (pub.track && pub.kind === "audio") hookTrackIntoRecorder(pub.track);
      });
    });

    if (audioDest.stream.getAudioTracks().length === 0) {
      const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const src = audioCtx.createMediaStreamSource(micStream);
      src.connect(audioDest);
    }

    recordedChunks = [];
    const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
      ? "audio/webm;codecs=opus"
      : "";

    mediaRecorder = mimeType
      ? new MediaRecorder(audioDest.stream, { mimeType })
      : new MediaRecorder(audioDest.stream);

    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = async () => {
      const finalDuration = formatTime(recSeconds);
      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || "audio/webm" });
      const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
      const fileName = (currentRoomName || "dars") + "-" + stamp + ".webm";

      if (audioCtx) {
        audioCtx.close().catch(() => {});
        audioCtx = null;
        audioDest = null;
      }

      if (!blob.size) {
        showTempBanner("⚠️ Ovoz fayli bo'sh chiqdi, qayta urinib ko'ring");
        return;
      }

      await deliverRecordedAudio(blob, fileName, finalDuration);
    };

    mediaRecorder.start(1000);
    recSeconds = 0;
    $("recDownloadLink").style.display = "none";
    $("recBanner").classList.remove("info-banner");
    $("recDot").style.display = "";
    $("recStatusText").innerHTML = 'Ovoz yozilmoqda: <b id="recTimer">00:00</b>';
    $("recBanner").classList.add("active");
    $("menuRecBtn").textContent = "⏹️ To‘xtatish va ovozni olish";
    $("menuRecBtn").classList.add("recording-item");

    if (recInterval) clearInterval(recInterval);
    recInterval = setInterval(() => {
      recSeconds++;
      const timerEl = $("recTimer");
      if (timerEl) timerEl.textContent = formatTime(recSeconds);
    }, 1000);
  } catch (err) {
    console.error("Start recording error:", err);
    showTempBanner("⚠️ Yozishni boshlashda xato: " + err.message);
  }
}

function stopRecording() {
  if (recInterval) {
    clearInterval(recInterval);
    recInterval = null;
  }

  $("menuRecBtn").textContent = "⏺️ Darsni yozishni boshlash";
  $("menuRecBtn").classList.remove("recording-item");

  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    try {
      mediaRecorder.requestData();
    } catch {}
    mediaRecorder.stop();
  } else {
    showTempBanner("⚠️ Yozuv faol emas edi");
  }
}

$("menuRecBtn").onclick = async () => {
  $("menuDropdown").classList.remove("open");
  if (mediaRecorder && mediaRecorder.state === "recording") {
    stopRecording();
  } else {

  }
};

async function joinRoom() {
  const name = $("name").value.trim();
  const rname = $("room").value.trim();
  if (!name || name === "." || !rname) {
    $("status").textContent = "Ism-familiya va xona nomini kiriting";
    return;
  }

  $("status").textContent = "Ulanmoqda...";
  $("joinBtn").disabled = true;

  try {
    const res = await fetch("/api/token", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ room: rname, name, role: selectedInitialRole })
    });

    let data;
    try {
      data = await res.json();
    } catch {
      throw new Error("Token serveri javob bermadi (" + res.status + ")");
    }

    const { token, url, error } = data;
    if (error || !res.ok) {
      throw new Error(error || ("Token olinmadi (" + res.status + ")"));
    }
    if (!token || !url || !/^wss?:\/\//.test(url)) {
      throw new Error("Server noto'g'ri LiveKit manzili yoki token qaytardi");
    }

    teachersMap.clear();
    handQueue = [];
    myHandRaised = false;
    panelForceOpen = selectedInitialRole === "teacher";

    room = new LivekitClient.Room({
      adaptiveStream: true,
      dynacast: true
    });

    room.on(LivekitClient.RoomEvent.DataReceived, (payload) => {
      try {
        const msg = JSON.parse(decoder.decode(payload));
        if (msg && msg.type === "ROOM_SYNC") {
          teachersMap.clear();
          (msg.teachers || []).forEach((tid) => teachersMap.set(tid, true));
          handQueue = Array.isArray(msg.queue) ? msg.queue.slice() : [];

          const lid = getLocalId();
          myHandRaised = lid ? handQueue.includes(lid) : false;
          $("handBtn").classList.toggle("active", myHandRaised);
          $("handLabel").textContent = myHandRaised ? "Tushirish" : "Qo‘l";

          if (msg.calledIdentity === lid) {
            showTempBanner("✋ Ustoz sizga navbat berdi! Mikrofon yoqildi.");
            if (room && !micEnabled) {
              micEnabled = true;
              room.localParticipant.setMicrophoneEnabled(true).catch(() => {});
              setTileMicState(lid, false);
              refreshControlButtons();
            }
          }

          if (msg.kickIdentity === lid && room) {
            room.disconnect();
            return;
          }

          refreshAllBadges();
          refreshTeacherPanel();
        }
      } catch (e) {
        console.warn("Data parse error:", e);
      }
    });

    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, pub, p) => {
      attach(track, p);
      if (track.kind === "video") setTileVideoState(p.identity, true);
    });

    room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track, pub, p) => {
      detachTrack(track, p);
    });

    room.on(LivekitClient.RoomEvent.TrackMuted, (pub, p) => {
      if (pub.kind === "audio") setTileMicState(p.identity, true);
      if (pub.kind === "video") setTileVideoState(p.identity, false);
    });

    room.on(LivekitClient.RoomEvent.TrackUnmuted, (pub, p) => {
      if (pub.kind === "audio") setTileMicState(p.identity, false);
      if (pub.kind === "video" && pub.track) {
        attach(pub.track, p);
        setTileVideoState(p.identity, true);
      }
    });

    room.on(LivekitClient.RoomEvent.ActiveSpeakersChanged, (speakers) => {
      const speakerIds = new Set(speakers.map((s) => s.identity));
      document.querySelectorAll(".tile").forEach((tile) => {
        const pid = tile.id.replace(/^t-/, "");
        const isSpeaking = speakerIds.has(pid);
        tile.classList.toggle("speaking", isSpeaking);
        const st = tile.querySelector(".status-text");
        if (st) st.textContent = isSpeaking ? "speaking" : "listening";
      });
    });

    room.on(LivekitClient.RoomEvent.ParticipantConnected, (p) => {
      syncParticipant(p, false);
      updateParticipantCount();
      if (isLocalTeacher()) {
        broadcastState();
      }
    });

    room.on(LivekitClient.RoomEvent.ParticipantDisconnected, (p) => {
      const t = document.getElementById("t-" + p.identity);
      if (t) t.remove();
      handQueue = handQueue.filter((x) => x !== p.identity);
      updateParticipantCount();
      refreshAllBadges();
      refreshTeacherPanel();
    });

    room.on(LivekitClient.RoomEvent.Disconnected, leave);

    await room.connect(url, token);

    if (selectedInitialRole === "teacher") {
      teachersMap.set(room.localParticipant.identity, true);
    }

    micEnabled = true;
    camEnabled = false;
    screenEnabled = false;
    await room.localParticipant.setMicrophoneEnabled(true);

    currentRoomName = rname;
    $("roomTitle").textContent = rname;
    $("join").style.display = "none";
    $("call").style.display = "flex";

    syncParticipant(room.localParticipant, true);
    room.remoteParticipants.forEach((p) => syncParticipant(p, false));
    updateParticipantCount();
    refreshAllBadges();
    refreshTeacherPanel();
    refreshControlButtons();
    broadcastState();
  } catch (e) {
    console.error(e);
    let msg = e && e.message ? e.message : String(e);
    if (/region settings|401|invalid token|unauthorized/i.test(msg)) {
      msg = "LiveKit tokenni rad etdi — API kalit/secret LiveKit loyihasiga mos emas (" + msg + ")";
    }
    $("status").textContent = "Xato: " + msg;
    if (room) {
      try { await room.disconnect(); } catch {}
      room = null;
    }
  } finally {
    $("joinBtn").disabled = false;
  }
}

$("joinBtn").onclick = joinRoom;

if (invitedRoom && $("name").value.trim() && $("name").value.trim() !== ".") {
  joinRoom();
}

$("micBtn").onclick = async () => {
  if (!room) return;
  micEnabled = !micEnabled;
  await room.localParticipant.setMicrophoneEnabled(micEnabled);
  setTileMicState(room.localParticipant.identity, !micEnabled);
  refreshControlButtons();
};

$("camBtn").onclick = async () => {
  if (!room) return;
  camEnabled = !camEnabled;
  await room.localParticipant.setCameraEnabled(camEnabled);

  const localId = room.localParticipant.identity;
  if (camEnabled) {
    const camPub = room.localParticipant.getTrackPublication(LivekitClient.Track.Source.Camera);
    if (camPub && camPub.track) {
      attach(camPub.track, room.localParticipant);
      setTileVideoState(localId, true);
    }
  } else {
    const t = document.getElementById("t-" + localId);
    if (t) {
      const oldVideo = t.querySelector("video");
      if (oldVideo) oldVideo.remove();
    }
    setTileVideoState(localId, false);
  }
  refreshControlButtons();
};

$("screenBtn").onclick = async () => {
  if (!room) return;
  try {
    screenEnabled = !screenEnabled;
    await room.localParticipant.setScreenShareEnabled(screenEnabled);
    refreshControlButtons();
  } catch (e) {
    screenEnabled = false;
    refreshControlButtons();
    console.error("Screen share error:", e);
  }
};

$("leaveBtn").onclick = async () => {
  if (mediaRecorder && mediaRecorder.state === "recording") {
    stopRecording();
  }
  if (room) {
    await room.disconnect();
  } else {
    leave();
  }
};

function leave() {
  if (mediaRecorder && mediaRecorder.state === "recording") {
    stopRecording();
  }
  room = null;
  screenEnabled = false;
  camEnabled = false;
  myHandRaised = false;
  handQueue = [];
  teachersMap.clear();
  $("handBtn").classList.remove("active");
  $("handLabel").textContent = "Qo‘l";
  $("teacherPanel").classList.remove("visible");
  $("call").style.display = "none";
  $("join").style.display = "flex";
  $("grid").innerHTML = "";
  $("status").textContent = "";
  document.querySelectorAll("audio").forEach((el) => {
    if (!el.closest("#call") && !el.closest("#join")) el.remove();
  });
}
</script>
</body>
</html>
