<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Videochat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.7/dist/livekit-client.umd.min.js"></script>
<style>
  :root {
    --bg: #0f141b;
    --surface: #18202a;
    --surface-2: #222c3a;
    --fg: #f3f6fa;
    --muted: #9aa7b8;
    --btn: #2481cc;
    --btnfg: #ffffff;
    --danger: #b83b3b;
    --rec: #dc2626;
    --border: rgba(255, 255, 255, 0.08);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  /* Kirish oynasi */
  #join {
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin: auto;
    width: 100%;
    max-width: 390px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
  }

  #join h2 {
    margin: 0 0 4px 0;
    font-size: 22px;
    text-align: center;
  }

  input {
    padding: 13px 14px;
    font-size: 15px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: var(--surface-2);
    color: var(--fg);
    outline: none;
  }

  input:focus {
    border-color: var(--btn);
  }

  input::placeholder {
    color: var(--muted);
  }

  button {
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.12s ease, opacity 0.15s ease, background 0.15s ease;
  }

  button:active {
    transform: scale(0.96);
  }

  #joinBtn {
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 10px;
    background: var(--btn);
    color: var(--btnfg);
  }

  #status {
    min-height: 18px;
    color: #ff8a8a;
    font-size: 13px;
    text-align: center;
    word-break: break-word;
  }

  /* Qo'ng'iroq oynasi */
  #call {
    display: none;
    flex: 1;
    flex-direction: column;
    min-height: 0;
    height: 100%;
    background: var(--bg);
  }

  /* Yuqori sarlavha */
  #topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  #roomTitleWrap {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  #roomTitle {
    font-size: 15px;
    font-weight: 700;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #participantCount {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .top-btn {
    background: var(--surface-2);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 12px;
    font-weight: 600;
  }

  #copyLinkBtn {
    background: rgba(36, 129, 204, 0.22);
    border-color: rgba(36, 129, 204, 0.5);
    color: #7cc4ff;
  }

  #recIndicator {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 999px;
    background: rgba(220, 38, 38, 0.16);
    border: 1px solid rgba(220, 38, 38, 0.45);
    color: #fca5a5;
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
  }

  #recIndicator.active {
    display: flex;
  }

  .rec-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--rec);
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Ishtirokchilar maydoni */
  #grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    padding: 12px;
    overflow-y: auto;
    align-content: start;
  }

  body.wide-grid #grid {
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
    padding: 16px;
  }

  .tile {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    min-height: 175px;
    aspect-ratio: 4 / 3;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tile.speaking {
    border-color: #38bdf8;
    box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25);
  }

  .tile video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .tile.video-off video {
    display: none;
  }

  .avatar-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 12px 10px 36px;
    text-align: center;
    max-width: 100%;
  }

  .avatar-circle {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #2b5b84;
    color: #ffffff;
    font-size: 19px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 0.5px;
    user-select: none;
  }

  .avatar-fullname {
    font-size: 13px;
    font-weight: 600;
    color: var(--fg);
    max-width: 160px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .status-text {
    font-size: 12px;
    color: var(--muted);
  }

  .tile-footer {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 10px 10px 8px;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .tile-name {
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .mic-badge {
    font-size: 12px;
    color: #ff8a8a;
    flex-shrink: 0;
  }

  /* Pastki boshqaruv tugmalari */
  #controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px 12px calc(24px + env(safe-area-inset-bottom, 0px));
    justify-content: center;
    align-items: center;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    position: relative;
    z-index: 20;
  }

  .ctrl-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-width: 52px;
  }

  .ctrl-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--surface-2);
    color: var(--fg);
    border: 1px solid rgba(255, 255, 255, 0.12);
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ctrl-btn.active {
    background: var(--btn);
    border-color: var(--btn);
    color: #fff;
  }

  .ctrl-btn.recording {
    background: var(--rec);
    border-color: var(--rec);
    color: #fff;
  }

  .ctrl-btn.off {
    opacity: 0.6;
  }

  #leaveBtn {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }

  .ctrl-label {
    font-size: 11px;
    color: var(--muted);
    user-select: none;
  }
</style>
</head>
<body>
<div id="join">
  <h2>Videochat</h2>
  <input id="name" placeholder="Ism va familiyangiz">
  <input id="room" placeholder="Xona nomi">
  <button id="joinBtn">Kirish</button>
  <small id="status"></small>
</div>

<div id="call">
  <div id="topbar">
    <div id="roomTitleWrap">
      <div id="roomTitle">Xona</div>
      <div id="participantCount">1 participant</div>
    </div>
    <div id="recIndicator">
      <span class="rec-dot"></span>
      <span id="recTimer">00:00</span>
    </div>
    <div class="top-actions">
      <button id="expandBtn" class="top-btn" type="button" title="Oynani kattalashtirish">Kattalashtirish</button>
      <button id="copyLinkBtn" class="top-btn" type="button" title="Taklif havolasini nusxalash">Silka olish</button>
    </div>
  </div>

  <div id="grid"></div>

  <div id="controls">
    <div class="ctrl-item">
      <button id="screenBtn" class="ctrl-btn" type="button" title="Ekran">🖥️</button>
      <span class="ctrl-label">Screen</span>
    </div>
    <div class="ctrl-item">
      <button id="camBtn" class="ctrl-btn active" type="button" title="Kamera">🎥</button>
      <span class="ctrl-label">Video</span>
    </div>
    <div class="ctrl-item">
      <button id="micBtn" class="ctrl-btn active" type="button" title="Mikrofon">🎤</button>
      <span class="ctrl-label">Mic</span>
    </div>
    <div class="ctrl-item">
      <button id="recBtn" class="ctrl-btn" type="button" title="Ovoz yozish">⏺️</button>
      <span class="ctrl-label">Ovoz yoz</span>
    </div>
    <div class="ctrl-item">
      <button id="leaveBtn" class="ctrl-btn" type="button" title="Chiqish">📞</button>
      <span class="ctrl-label">Leave</span>
    </div>
  </div>
</div>

<script>
const BOT_USERNAME = "darsvideochati_bot";
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready();
  tg.expand();
}

const $ = (id) => document.getElementById(id);

/* Telegram foydalanuvchi ism-familiyasini olish */
const user = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
if (user && user.first_name) {
  const full = [user.first_name, user.last_name].filter(Boolean).join(" ").trim();
  if (full && full !== ".") {
    $("name").value = full;
  }
}

/* Havola orqali kelgan xona nomini o'qish (?startapp=... yoki ?room=...) */
function getInviteRoomFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const fromQuery = params.get("room") || params.get("tgWebAppStartParam");
  const fromTg = tg && tg.initDataUnsafe ? tg.initDataUnsafe.start_param : "";
  const raw = (fromTg || fromQuery || "").trim();
  if (!raw) return "";
  try {
    return decodeURIComponent(raw);
  } catch {
    return raw;
  }
}

const invitedRoom = getInviteRoomFromUrl();
if (invitedRoom) {
  $("room").value = invitedRoom;
}

let room;
let micEnabled = true;
let camEnabled = true;
let screenEnabled = false;
let currentRoomName = "";

/* Ovoz yozib olish holati */
let mediaRecorder = null;
let recordedChunks = [];
let recSeconds = 0;
let recInterval = null;
let audioCtx = null;
let audioDest = null;
const connectedAudioSources = new Map();

function getInitials(fullName) {
  const parts = String(fullName || "U").trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return "U";
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function updateParticipantCount() {
  if (!room) {
    $("participantCount").textContent = "1 participant";
    return;
  }
  const total = 1 + (room.remoteParticipants ? room.remoteParticipants.size : 0);
  $("participantCount").textContent = total + (total === 1 ? " participant" : " participants");
}

function addTile(id, displayName) {
  const safeName = displayName || id;
  let t = document.getElementById("t-" + id);
  if (!t) {
    t = document.createElement("div");
    t.className = "tile video-off";
    t.id = "t-" + id;

    const avatarBox = document.createElement("div");
    avatarBox.className = "avatar-box";
    avatarBox.innerHTML =
      '<div class="avatar-circle">' + getInitials(safeName) + '</div>' +
      '<div class="avatar-fullname" title="' + safeName + '">' + safeName + '</div>' +
      '<div class="status-text">listening</div>';

    const footer = document.createElement("div");
    footer.className = "tile-footer";
    footer.innerHTML =
      '<span class="tile-name" title="' + safeName + '">' + safeName + '</span>' +
      '<span class="mic-badge" id="mic-state-' + id + '"></span>';

    t.appendChild(avatarBox);
    t.appendChild(footer);
    $("grid").appendChild(t);
  } else {
    const fn = t.querySelector(".avatar-fullname");
    const tn = t.querySelector(".tile-name");
    const av = t.querySelector(".avatar-circle");
    if (fn) { fn.textContent = safeName; fn.title = safeName; }
    if (tn) { tn.textContent = safeName; tn.title = safeName; }
    if (av) av.textContent = getInitials(safeName);
  }
  return t;
}

function setTileVideoState(id, hasVideo) {
  const t = document.getElementById("t-" + id);
  if (!t) return;
  if (hasVideo) {
    t.classList.remove("video-off");
  } else {
    t.classList.add("video-off");
  }
}

function setTileMicState(id, isMuted) {
  const badge = document.getElementById("mic-state-" + id);
  if (!badge) return;
  badge.textContent = isMuted ? "🔇" : "";
}

function hookTrackIntoRecorder(track) {
  if (!audioDest || track.kind !== "audio" || !track.mediaStreamTrack) return;
  if (connectedAudioSources.has(track.sid || track.mediaStreamTrack.id)) return;
  try {
    const stream = new MediaStream([track.mediaStreamTrack]);
    const source = audioCtx.createMediaStreamSource(stream);
    source.connect(audioDest);
    connectedAudioSources.set(track.sid || track.mediaStreamTrack.id, source);
  } catch (e) {
    console.warn("Audio mix error:", e);
  }
}

function attach(track, participant) {
  const id = participant.identity;
  const displayName = participant.name || id;
  const t = addTile(id, displayName);

  if (track.kind === "video") {
    const oldVideo = t.querySelector("video");
    if (oldVideo) oldVideo.remove();
    const videoEl = track.attach();
    t.prepend(videoEl);
    setTileVideoState(id, true);
  } else if (track.kind === "audio") {
    if (!participant.isLocal) {
      const audioEl = track.attach();
      document.body.appendChild(audioEl);
    }
    hookTrackIntoRecorder(track);
  }
}

function detachTrack(track, participant) {
  const els = track.detach();
  els.forEach((el) => el.remove());
  if (track.kind === "video" && participant) {
    const t = document.getElementById("t-" + participant.identity);
    if (t && !t.querySelector("video")) {
      setTileVideoState(participant.identity, false);
    }
  }
}

function syncParticipant(participant, isLocal = false) {
  const id = participant.identity;
  const displayName = participant.name || id;
  addTile(id, displayName);

  let hasActiveVideo = false;
  participant.trackPublications.forEach((pub) => {
    if (pub.track && pub.kind === "video" && !pub.isMuted) {
      attach(pub.track, participant);
      hasActiveVideo = true;
    } else if (pub.track && pub.kind === "audio") {
      if (!isLocal) attach(pub.track, participant);
      else hookTrackIntoRecorder(pub.track);
    }
  });
  setTileVideoState(id, hasActiveVideo);

  const micPub = participant.getTrackPublication(LivekitClient.Track.Source.Microphone);
  setTileMicState(id, !micPub || micPub.isMuted);
}

/* Oynani kattalashtirish */
$("expandBtn").onclick = () => {
  if (tg) {
    try { tg.expand(); } catch {}
    if (typeof tg.requestFullscreen === "function") {
      try { tg.requestFullscreen(); } catch {}
    }
  }
  document.body.classList.toggle("wide-grid");
  if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else if (document.fullscreenElement && document.exitFullscreen) {
    document.exitFullscreen().catch(() => {});
  }
  $("expandBtn").textContent = document.body.classList.contains("wide-grid") ? "Oddiy oyna" : "Kattalashtirish";
};

/* Taklif havolasini yaratish va nusxalash */
function buildInviteLink(roomName) {
  const encoded = encodeURIComponent(roomName.trim());
  if (tg && BOT_USERNAME) {
    return "https://t.me/" + BOT_USERNAME + "?startapp=" + encoded;
  }
  return window.location.origin + "/?room=" + encoded;
}

$("copyLinkBtn").onclick = async () => {
  if (!currentRoomName) return;
  const inviteLink = buildInviteLink(currentRoomName);
  try {
    await navigator.clipboard.writeText(inviteLink);
    $("copyLinkBtn").textContent = "Silka nusxalandi!";
    setTimeout(() => { $("copyLinkBtn").textContent = "Silka olish"; }, 1800);
  } catch {
    prompt("Quyidagi havolani nusxalab yuboring:", inviteLink);
  }
};

/* Ovoz yozib olish */
function formatTime(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, "0");
  const s = String(sec % 60).padStart(2, "0");
  return m + ":" + s;
}

async function startRecording() {
  if (!room) return;
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AudioContextClass();
  audioDest = audioCtx.createMediaStreamDestination();
  connectedAudioSources.clear();

  const localMic = room.localParticipant.getTrackPublication(LivekitClient.Track.Source.Microphone);
  if (localMic && localMic.track) hookTrackIntoRecorder(localMic.track);

  room.remoteParticipants.forEach((p) => {
    p.trackPublications.forEach((pub) => {
      if (pub.track && pub.kind === "audio") hookTrackIntoRecorder(pub.track);
    });
  });

  if (audioDest.stream.getAudioTracks().length === 0) {
    try {
      const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const src = audioCtx.createMediaStreamSource(micStream);
      src.connect(audioDest);
    } catch (e) {
      alert("Mikrofon oqimi topilmadi: " + e.message);
      return;
    }
  }

  recordedChunks = [];
  const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
    ? "audio/webm;codecs=opus"
    : "";
  mediaRecorder = mimeType
    ? new MediaRecorder(audioDest.stream, { mimeType })
    : new MediaRecorder(audioDest.stream);

  mediaRecorder.ondataavailable = (e) => {
    if (e.data && e.data.size > 0) recordedChunks.push(e.data);
  };

  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || "audio/webm" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
    a.href = url;
    a.download = (currentRoomName || "videochat") + "-ovoz-" + stamp + ".webm";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);

    if (audioCtx) {
      audioCtx.close().catch(() => {});
      audioCtx = null;
      audioDest = null;
    }
  };

  mediaRecorder.start();
  recSeconds = 0;
  $("recTimer").textContent = "00:00";
  $("recIndicator").classList.add("active");
  $("recBtn").classList.add("recording");
  $("recBtn").textContent = "⏹️";

  recInterval = setInterval(() => {
    recSeconds++;
    $("recTimer").textContent = formatTime(recSeconds);
  }, 1000);
}

function stopRecording() {
  if (recInterval) {
    clearInterval(recInterval);
    recInterval = null;
  }
  $("recIndicator").classList.remove("active");
  $("recBtn").classList.remove("recording");
  $("recBtn").textContent = "⏺️";

  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    mediaRecorder.stop();
  }
  mediaRecorder = null;
}

$("recBtn").onclick = async () => {
  if (mediaRecorder && mediaRecorder.state === "recording") {
    stopRecording();
  } else {
    await startRecording();
  }
};

async function joinRoom() {
  const name = $("name").value.trim();
  const rname = $("room").value.trim();
  if (!name || name === "." || !rname) {
    $("status").textContent = "Ism-familiya va xona nomini kiriting";
    return;
  }

  $("status").textContent = "Ulanmoqda...";
  $("joinBtn").disabled = true;

  try {
    const res = await fetch("/.netlify/functions/token", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ room: rname, name })
    });

    let data;
    try {
      data = await res.json();
    } catch {
      throw new Error("Token serveri javob bermadi (" + res.status + ")");
    }

    const { token, url, error } = data;
    if (error || !res.ok) {
      throw new Error(error || ("Token olinmadi (" + res.status + ")"));
    }
    if (!token || !url || !/^wss?:\/\//.test(url)) {
      throw new Error("Server noto'g'ri LiveKit manzili yoki token qaytardi");
    }

    room = new LivekitClient.Room({
      adaptiveStream: true,
      dynacast: true
    });

    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, pub, p) => {
      attach(track, p);
      if (track.kind === "video") setTileVideoState(p.identity, true);
    });

    room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track, pub, p) => {
      detachTrack(track, p);
    });

    room.on(LivekitClient.RoomEvent.TrackMuted, (pub, p) => {
      if (pub.kind === "audio") setTileMicState(p.identity, true);
      if (pub.kind === "video") setTileVideoState(p.identity, false);
    });

    room.on(LivekitClient.RoomEvent.TrackUnmuted, (pub, p) => {
      if (pub.kind === "audio") setTileMicState(p.identity, false);
      if (pub.kind === "video" && pub.track) {
        attach(pub.track, p);
        setTileVideoState(p.identity, true);
      }
    });

    room.on(LivekitClient.RoomEvent.ActiveSpeakersChanged, (speakers) => {
      const speakerIds = new Set(speakers.map((s) => s.identity));
      document.querySelectorAll(".tile").forEach((tile) => {
        const pid = tile.id.replace(/^t-/, "");
        const isSpeaking = speakerIds.has(pid);
        tile.classList.toggle("speaking", isSpeaking);
        const st = tile.querySelector(".status-text");
        if (st) st.textContent = isSpeaking ? "speaking" : "listening";
      });
    });

    room.on(LivekitClient.RoomEvent.ParticipantConnected, (p) => {
      syncParticipant(p, false);
      updateParticipantCount();
    });

    room.on(LivekitClient.RoomEvent.ParticipantDisconnected, (p) => {
      const t = document.getElementById("t-" + p.identity);
      if (t) t.remove();
      updateParticipantCount();
    });

    room.on(LivekitClient.RoomEvent.Disconnected, leave);

    await room.connect(url, token);

    micEnabled = true;
    camEnabled = true;
    screenEnabled = false;
    await room.localParticipant.enableCameraAndMicrophone();

    currentRoomName = rname;
    $("roomTitle").textContent = rname;
    $("join").style.display = "none";
    $("call").style.display = "flex";

    syncParticipant(room.localParticipant, true);
    room.remoteParticipants.forEach((p) => syncParticipant(p, false));
    updateParticipantCount();
    refreshControlButtons();
  } catch (e) {
    console.error(e);
    let msg = e && e.message ? e.message : String(e);
    if (/region settings|401|invalid token|unauthorized/i.test(msg)) {
      msg = "LiveKit tokenni rad etdi — API kalit/secret LiveKit loyihasiga mos emas (" + msg + ")";
    }
    $("status").textContent = "Xato: " + msg;
    if (room) {
      try { await room.disconnect(); } catch {}
      room = null;
    }
  } finally {
    $("joinBtn").disabled = false;
  }
}

$("joinBtn").onclick = joinRoom;

/* Agar foydalanuvchi silka bilan kirgan bo'lsa va ismi tayyor bo'lsa, avtomatik xonaga ulanish */
if (invitedRoom && $("name").value.trim() && $("name").value.trim() !== ".") {
  joinRoom();
}

function refreshControlButtons() {
  $("micBtn").classList.toggle("active", micEnabled);
  $("micBtn").classList.toggle("off", !micEnabled);

  $("camBtn").classList.toggle("active", camEnabled);
  $("camBtn").classList.toggle("off", !camEnabled);

  $("screenBtn").classList.toggle("active", screenEnabled);
  $("screenBtn").classList.toggle("off", !screenEnabled);
}

$("micBtn").onclick = async () => {
  if (!room) return;
  micEnabled = !micEnabled;
  await room.localParticipant.setMicrophoneEnabled(micEnabled);
  setTileMicState(room.localParticipant.identity, !micEnabled);
  refreshControlButtons();
};

$("camBtn").onclick = async () => {
  if (!room) return;
  camEnabled = !camEnabled;
  await room.localParticipant.setCameraEnabled(camEnabled);

  const localId = room.localParticipant.identity;
  if (camEnabled) {
    const camPub = room.localParticipant.getTrackPublication(LivekitClient.Track.Source.Camera);
    if (camPub && camPub.track) {
      attach(camPub.track, room.localParticipant);
      setTileVideoState(localId, true);
    }
  } else {
    const t = document.getElementById("t-" + localId);
    if (t) {
      const oldVideo = t.querySelector("video");
      if (oldVideo) oldVideo.remove();
    }
    setTileVideoState(localId, false);
  }
  refreshControlButtons();
};

$("screenBtn").onclick = async () => {
  if (!room) return;
  try {
    screenEnabled = !screenEnabled;
    await room.localParticipant.setScreenShareEnabled(screenEnabled);
    refreshControlButtons();
  } catch (e) {
    screenEnabled = false;
    refreshControlButtons();
    console.error("Screen share error:", e);
  }
};

$("leaveBtn").onclick = async () => {
  if (mediaRecorder && mediaRecorder.state === "recording") {
    stopRecording();
  }
  if (room) {
    await room.disconnect();
  } else {
    leave();
  }
};

function leave() {
  if (mediaRecorder && mediaRecorder.state === "recording") {
    stopRecording();
  }
  room = null;
  screenEnabled = false;
  $("call").style.display = "none";
  $("join").style.display = "flex";
  $("grid").innerHTML = "";
  $("status").textContent = "";
  document.querySelectorAll("audio").forEach((el) => {
    if (!el.closest("#call") && !el.closest("#join")) el.remove();
  });
}
</script>
</body>
</html>
